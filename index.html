<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7; color: #16181d;
  }
  form { width: 100%; max-width: 360px; background: #fff; padding: 24px; border-radius: 14px;
         box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.06); }
  h1 { margin: 0 0 20px; font-size: 18px; font-weight: 600; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: #555b66; }
  input { width: 100%; padding: 12px; margin-bottom: 16px; font-size: 16px;
          border: 1px solid #d3d6dc; border-radius: 8px; background: #fff; color: inherit; }
  input:focus { outline: 2px solid #2563eb; outline-offset: -1px; border-color: #2563eb; }
  button { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; color: #fff;
           background: #2563eb; border: 0; border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { opacity: .55; cursor: default; }
  #result { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none;
            white-space: pre-wrap; word-break: break-word; }
  #result.ok  { display: block; background: #e8f5ec; color: #14602f; }
  #result.err { display: block; background: #fdeaea; color: #8c1c1c; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8eaed; }
    form { background: #1d2025; box-shadow: none; }
    label { color: #9aa1ad; }
    input { background: #14161a; border-color: #33383f; }
    #result.ok  { background: #12301d; color: #7ee2a0; }
    #result.err { background: #351717; color: #f4a4a4; }
  }
</style>
</head>
<body>
<form id="form">
  <h1>Испрати SMS</h1>

  <label for="number">Телефонски број</label>
  <input id="number" name="number" type="tel" inputmode="tel" autocomplete="tel"
         placeholder="+389 75 560 524" value="+389 75 560 524" required>

  <button type="submit" id="submit">Испрати</button>
  <div id="result" role="status" aria-live="polite"></div>
</form>

<script>
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const result = document.getElementById('result');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    submit.disabled = true;
    submit.textContent = 'Се испраќа…';
    result.className = '';
    result.textContent = '';

    try {
      const response = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          number: document.getElementById('number').value,
          // Optional shared key, taken from ?k=... so there is nothing to type.
          pin: new URLSearchParams(location.search).get('k') || '',
        }),
      });
      const data = await response.json();

      if (data.ok) {
        result.className = 'ok';
        result.textContent = (data.dryRun ? 'DRY RUN — не е испратено:\n' : 'Испратено ✓\n') + data.text;
      } else {
        result.className = 'err';
        result.textContent = data.error || 'Неуспешно испраќање';
      }
    } catch (err) {
      result.className = 'err';
      result.textContent = 'Мрежна грешка: ' + err.message;
    } finally {
      submit.disabled = false;
      submit.textContent = 'Испрати';
    }
  });
</script>
</body>
</html>
